[package]
name = "ai-pet"
version = "0.2.0"
edition = "2021"
authors = ["Jonas <https://github.com/Fischer86>"]
license = "MIT"
repository = "https://github.com/Fischer86/ai-pet"
description = "Kaze (風) — Compagnon de bureau AI Pet Samouraï Zen (Linux KDE/Wayland/X11, macOS, Windows) propulsé par Ollama"

[dependencies]
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
arboard = "3.4"
sysinfo = "0.33"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
x11rb = "0.13"

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
